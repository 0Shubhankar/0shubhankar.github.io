<!DOCTYPE html>
<html>

<head>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Chicago Crime Heatmap</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/shared/lib-34b3c0e131eb/dist/leaflet.css" />
    <style>
        #map {
            height: 600px;
        }

        #source {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <p id="map-status" role="status" style="position:fixed;top:8px;left:48px;right:8px;z-index:1000;background:white;padding:8px;font:14px sans-serif;">Loading crime data…</p>
   
    <script src="../vendor/shared/lib-5d00f470f487/dist/leaflet.js"></script>
    <script src="../shared/map-tiles.js"></script>
    <script src="../vendor/shared/lib-5cb2beba5c37/dist/leaflet-heat.js"></script>
    <script src="../vendor/shared/lib-a3133eb07bfa/dist/jquery-3.6.0.min.js"></script>

    <script>
        var statusMessage = document.getElementById('map-status');
        if (location.protocol === 'file:') {
            statusMessage.textContent = 'Open this project using Start Portfolio.command in the publishing folder. Local file access can block crime data.';
        }
        if (typeof L === 'undefined' || typeof L.heatLayer !== 'function' || typeof $ === 'undefined') {
            statusMessage.textContent = 'Map libraries could not load. Check your internet connection and reload.';
            throw new Error('Required map library unavailable');
        }
        var map = L.map('map').setView([41.8781, -87.6298], 12); // Centered on Chicago

        var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Data source: <a href="https://data.cityofchicago.org/Public-Safety/Crimes-2001-to-Present/ijzp-q8t2/about_data" target="_blank">City of Chicago</a>'
        }).addTo(map);

        tiles.on('tileerror', function () {
            statusMessage.hidden = false;
            statusMessage.textContent = 'Some street-map tiles could not load. Check your internet connection and reload.';
            statusMessage.dataset.tileError = 'true';
        });
        window.addEventListener('resize', function () { map.invalidateSize(); });

        // Load the crime data
        $.getJSON('chicago_crime_data.json', function (data) {
            var heatData = data.map(function (point) {
                return [point.Latitude, point.Longitude, point.crime_count];
            });

            L.heatLayer(heatData, {
                radius: 13, // Adjust radius for visualization
                blur: 20,   // Adjust blur for visualization
                maxZoom: 17,
                gradient: { 0.4: 'blue', 0.65: 'red', 0.75: 'red' } // Color gradient
            }).addTo(map);
            if (!statusMessage.dataset.tileError) statusMessage.hidden = true;
        }).fail(function () {
            statusMessage.hidden = false;
            statusMessage.textContent = location.protocol === 'file:'
                ? 'Crime data is blocked when opened as a file. Use Start Portfolio.command in the publishing folder.'
                : 'Crime data could not load. Reload the page and check that the project JSON files are present.';
        });
    </script>
</body>

</html>
