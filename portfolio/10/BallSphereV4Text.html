<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta viewport="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Network Graph</title>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <script src="../vendor/shared/lib-51d788816744/dist/papaparse.min.js"></script>
    <script src="../vendor/shared/lib-4659aba89717/dist/dat.gui.min.js"></script>
    <script type="module">
        import * as THREE from '../vendor/shared/lib-a64c14149358/dist/three.module.js';
        import { OrbitControls } from '../vendor/shared/lib-4eca773b8753/dist/OrbitControls.js';

        let scene, camera, renderer, controls, raycaster, mouse;
        const pointMap = new Map(); // To hold sprites for line drawing
        const lineMap = new Map(); // To manage lines and their connections
        const params = {
            sphereRadius: 54,
            fontSize: 24,
            nonHighlightedLineColor: "#bbbbbb",
            nonHighlightedTextColor: "#ffffff",
            highlightedColor: "#ff0000"
        };

        init();
        loadCSVData();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.25;
            controls.screenSpacePanning = false;
            controls.minDistance = 0.06;
            controls.maxDistance = 500;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const gui = new dat.GUI();
            gui.add(params, 'sphereRadius', 10, 100).name('Sphere Radius').onChange(updatePositions);
            gui.add(params, 'fontSize', 10, 40).name('Font Size').onChange(updateFont);
            gui.addColor(params, 'nonHighlightedLineColor').name('Line Color').onChange(updateLineColor);
            gui.addColor(params, 'nonHighlightedTextColor').name('Text Color').onChange(updateTextColor);
            gui.addColor(params, 'highlightedColor').name('Highlighted Color');

            document.addEventListener('mousemove', onMouseMove, false);
        }

        function createTextSprite(message, color = params.nonHighlightedTextColor, fontSize = params.fontSize) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = `Bold ${fontSize}px Arial`;
            context.fillStyle = color;
            context.textAlign = 'center';
            context.fillText(message, 128, 64);

            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;

            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(12, 6, 1);
            return sprite;
        }

        function loadCSVData() {
            Papa.parse('city5.csv', {
                download: true,
                header: true,
                complete: function (results) {
                    results.data.forEach((row, index) => {
                        const phi = Math.acos(2 * (index / results.data.length) - 1);
                        const theta = Math.sqrt(results.data.length * Math.PI) * phi;

                        const x = params.sphereRadius * Math.sin(phi) * Math.cos(theta);
                        const y = params.sphereRadius * Math.sin(phi) * Math.sin(theta);
                        const z = params.sphereRadius * Math.cos(phi);

                        const sprite = createTextSprite(row.Description);
                        sprite.position.set(x, y, z);
                        scene.add(sprite);
                        pointMap.set(row.Description, sprite);
                    });
                    loadSimilarityData();
                }
            });
        }

        function loadSimilarityData() {
            Papa.parse('similarities.csv', {
                download: true,
                header: true,
                complete: function (results) {
                    results.data.forEach((row) => {
                        const sprite1 = pointMap.get(row['Description 1']);
                        const sprite2 = pointMap.get(row['Description 2']);
                        const similarity = parseFloat(row.Similarity);

                        if (sprite1 && sprite2 && similarity >= 0.5) {
                            const material = new THREE.LineBasicMaterial({
                                color: params.nonHighlightedLineColor,
                                opacity: similarity,
                                transparent: true
                            });
                            const points = [sprite1.position, sprite2.position];
                            const geometry = new THREE.BufferGeometry().setFromPoints(points);
                            const line = new THREE.Line(geometry, material);
                            scene.add(line);

                            if (!lineMap.has(sprite1)) lineMap.set(sprite1, []);
                            if (!lineMap.has(sprite2)) lineMap.set(sprite2, []);
                            lineMap.get(sprite1).push(line);
                            lineMap.get(sprite2).push(line);
                        }
                    });
                }
            });
        }

        function updatePositions() {
            // Updates positions of sprites when sphere radius changes
        }

        function updateFont() {
            pointMap.forEach((sprite, description) => {
                const updatedSprite = createTextSprite(description, params.nonHighlightedTextColor, params.fontSize);
                updatedSprite.position.copy(sprite.position);
                scene.remove(sprite);
                scene.add(updatedSprite);
                pointMap.set(description, updatedSprite);
            });
        }

        function updateLineColor() {
            lineMap.forEach(lines => {
                lines.forEach(line => {
                    line.material.color.set(params.nonHighlightedLineColor);
                });
            });
        }

        function updateTextColor() {
            pointMap.forEach((sprite, description) => {
                const updatedSprite = createTextSprite(description, params.nonHighlightedTextColor, params.fontSize);
                updatedSprite.position.copy(sprite.position);
                scene.remove(sprite);
                scene.add(updatedSprite);
                pointMap.set(description, updatedSprite);
            });
        }

        function onMouseMove(event) {
            event.preventDefault();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);

            if (intersects.length > 0) {
                const intersected = intersects[0].object;
                if (pointMap.has(intersected)) {
                    highlightRelated(intersected);
                }
            } else {
                resetHighlights();
            }
        }

        function highlightRelated(sprite) {
            resetHighlights();
            if (lineMap.has(sprite)) {
                lineMap.get(sprite).forEach(line => {
                    line.material.color.set(params.highlightedColor);
                    line.material.linewidth = 2;
                });
            }
        }

        function resetHighlights() {
            lineMap.forEach(lines => {
                lines.forEach(line => {
                    line.material.color.set(params.nonHighlightedLineColor);
                    line.material.linewidth = 1;
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
