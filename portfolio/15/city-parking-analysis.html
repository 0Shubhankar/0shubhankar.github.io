            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
            }).addTo(map);

            let parkingPolygonLayer = null;
            let parkingPointLayer = null;
            let currentCityRequest = 0;



        function loadCityData(city) {
            if (!city) return; // Exit if no city is selected

            const coordinates = {
                "Delhi, India": [77.2167, 28.6315],
                "Mumbai, India": [72.8246, 18.9250],

                "Shanghai, China": [121.4737, 31.2304],

                "Shenzhen, China": [114.0579, 22.5431],
                "Istanbul, Turkey": [28.9784, 41.0082],
                "Moscow, Russia": [37.6173, 55.7558],
                "London, UK": [-0.1276, 51.5074],
                "Saint Petersburg, Russia": [30.3609, 59.9311],
                "Berlin, Germany": [13.4050, 52.5200],
                "Madrid, Spain": [-3.7038, 40.4168],
                "Kinshasa, DRC": [15.2663, -4.4419],
                "Lagos, Nigeria": [3.3792, 6.5244],
                "Cairo, Egypt": [31.2357, 30.0444],
                "Paris, France": [2.3522, 48.8566],
                "Tokyo, Japan": [139.6917, 35.6895],
                "Mexico City, Mexico": [-99.1332, 19.4326],
                "São Paulo, Brazil": [-46.6333, -23.5505],
                "Buenos Aires, Argentina": [-58.3816, -34.6037],
                "Rio de Janeiro, Brazil": [-43.1729, -22.9068],
                "Sydney, Australia": [151.2093, -33.8688],
                "Melbourne, Australia": [144.9631, -37.8136],
                "Auckland, New Zealand": [174.7633, -36.8485]
            };

            map.flyTo(
                    [coordinates[city][1], coordinates[city][0]],
                    12
                );

            // Populate the city data table
            const cityInfo = cityData[city];
            const tbody = document.querySelector("#cityTable tbody");
            tbody.innerHTML = `
                <tr>
                    <td>${city}</td>
                    <td>${cityInfo['Population']}</td>
                    <td>${cityInfo['Actual Cars']}</td>
                    <td>${cityInfo['Parking Area (km²)']}</td>
                    <td>${cityInfo['Cars per km²']}</td>
                    <td>${cityInfo['Parking Area per Capita (m²/person)']}</td>
                    <td>${cityInfo['Parking Space per Car (m²/Car)']}</td>
                    <td>${cityInfo['Summary']}</td>
                    <td>${cityInfo['Inference']}</td>
                </tr>
            `;

            // Load parking polygons and points using Leaflet.
            const fileName =
                `${city.replace(/, /g, '_').replace(/ /g, '_')}_parking.geojson`;

            const requestId = ++currentCityRequest;


            fetch(fileName)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(
                            `GeoJSON HTTP ${response.status}: ${fileName}`
                        );
                    }
                    return response.json();
                })
                .then(data => {
                    if (requestId !== currentCityRequest) return;

                    const polygons = L.geoJSON(data, {
                        filter: feature =>
                            ['Polygon', 'MultiPolygon'].includes(
                                feature.geometry?.type
                            ),
                        style: {
                            color: '#ff1c95',
                            weight: 0,
                            fillColor: '#ff1c95',
                            fillOpacity: 0.5
                        }
                    });

                    const points = L.geoJSON(data, {
                        filter: feature =>
                            feature.geometry?.type === 'Point',
                        pointToLayer: (feature, latlng) =>
                            L.circleMarker(latlng, {
                                radius: 5,
                                color: '#ffffff',
                                weight: 1,
                                fillColor: '#0000ff',
                                fillOpacity: 1
                            })
                    });

                    if (parkingPolygonLayer)
                        map.removeLayer(parkingPolygonLayer);

                    if (parkingPointLayer)
                        map.removeLayer(parkingPointLayer);

                    parkingPolygonLayer = polygons.addTo(map);
                    parkingPointLayer = points.addTo(map);


                })
                .catch(err => {
                    console.error('Error loading parking GeoJSON:', err);

                });
        }

        // Optionally, load default city on start
        loadCityData('Auckland, New Zealand');
