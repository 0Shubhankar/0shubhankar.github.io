<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gotham — HPE preview</title><style>
         body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: 'Courier New', Courier, monospace;
        padding: 0 10%;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
    }

    .typewriter {
        font-size: 24px;
        border-right: 2px solid;
        white-space: pre-wrap;
        overflow: hidden;
        animation: blink 0.75s step-end infinite;
        margin-bottom: 20px;
        text-align: center;
        max-width: 100%;
    }

    @keyframes blink {
        from, to { border-color: transparent }
        50% { border-color: transparent }
    }

    .options {
        display: flex;
        flex-direction: row;
        align-items: center;
        opacity: 0;
        transition: opacity 2s ease;
    }

    .button {
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        padding: 10px 20px;
        margin: 10px;
        cursor: pointer;
        border: 2px solid #333;
        background-color: #fff;
        transition: background-color 0.3s, color 0.3s;
    }

    .button:hover {
        background-color: #333;
        color: #fff;
    }

    body {
            background-color: #000000;
            /* Dark Gray */
            color: #FAFAFA;
            /* Light Gray */
        }
    
        .button {
            background-color: #44e7c9;
            /* Gold */
            color: #000000;
            /* Dark Gray */
        }
    
        .button:hover {
            background-color: #000000;
            color: #ffffff;
        }
    
    </style><style>body{min-height:100vh;height:auto;padding-top:24px;padding-bottom:24px}.options{flex-wrap:wrap;justify-content:center;transition:opacity .2s}.typewriter{font-size:clamp(16px,2.1vw,24px)}#housingMetrics{font:12px/1.6 'Courier New',monospace;color:#44e7c9;margin:0 0 24px;text-align:center;max-width:100%}</style></head><body><div id="storyText" class="story-text typewriter"></div><div id="optionsContainer" class="options"></div><script type="module" src="./engine/gotham-preview.js"></script></body></html>
