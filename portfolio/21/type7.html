<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayor Tater's Adventure in Spudsville</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #595959;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 0 10%;
            box-sizing: border-box;
        }

        .typewriter {
            font-size: 24px;
            color: #ffffff;
            border-right: 2px solid;
            white-space: pre-wrap;
            overflow: hidden;
            animation: blink 0.75s step-end infinite;
            margin-bottom: 20px;
            text-align: center;
            max-width: 100%;
        }

        @keyframes blink {

            from,
            to {
                border-color: transparent
            }

            50% {
                border-color: black
            }
        }

        .options {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            /* Start invisible */
            transition: opacity 5s ease;
            /* Smooth transition for opacity */
        }

        .button {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border: 2px solid #333;
            background-color: #fff;
            transition: background-color 0.3s, color 0.3s;
        }

        .button:hover {
            background-color: #333;
            color: #fff;
        }
        
    </style>
</head>

<body>
    <div id="storyText" class="story-text typewriter"></div>
    <div id="optionsContainer" class="options"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const storyText = document.getElementById('storyText');
            const optionsContainer = document.getElementById('optionsContainer');

            function typeText(text, callback) {
                let i = 0;
                storyText.innerHTML = ""; // Clear previous text
                const speed = 55; // Speed of typing

                function type() {
                    if (i < text.length) {
                        storyText.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else if (callback) {
                        callback();
                    }
                }

                type(); // Start typing effect
            }

            function displayStep(step) {
                const currentStep = steps[step];
                optionsContainer.innerHTML = ''; // Clear previous options
                optionsContainer.style.opacity = 0; // Reset opacity to 0 for fade-in effect

                typeText(currentStep.text, () => {
                    currentStep.options.forEach(option => {
                        const button = document.createElement('button');
                        button.textContent = option.text;
                        button.className = 'button';
                        button.onclick = () => displayStep(option.nextStep);
                        optionsContainer.appendChild(button);
                    });
                    setTimeout(() => optionsContainer.style.opacity = 1, 100); // Fade in options after 100ms
                });
            }

            const steps = {
                start: {
                    text: "In the once peaceful town of Spudsville, crime is on the rise—someone’s been mashing more than just potatoes! 🕵️‍♂️. What would you do?",
                    options: [
                        { text: "Increase Police Presence", nextStep: "a" },
                        { text: "Implement Public Surveillance", nextStep: "b" }
                    ]
                },
                a: {
                    text: "You chose to increase police presence. Choose your policy:",
                    options: [
                        { text: "Zero Tolerance Policy", nextStep: "a1" },
                        { text: "Community Policing", nextStep: "a2" }
                    ]
                },
                a1: {
                    text: "You've implemented a Zero Tolerance Policy. How do you proceed?",
                    options: [
                        { text: "Evaluate Impact", nextStep: "s" },
                        { text: "Continue with Policy", nextStep: "restart" }
                    ]
                },
                a2: {
                    text: "You've decided to invest in Community Policing. How do you proceed?",
                    options: [
                        { text: "Increase Community Outreach", nextStep: "s" },
                        { text: "Review and Adjust Strategy", nextStep: "s" }
                    ]
                },
                b: {
                    text: "You chose to implement public surveillance. Choose your approach:",
                    options: [
                        { text: "Expand Surveillance Network", nextStep: "b1" },
                        { text: "Introduce Privacy Safeguards", nextStep: "b2" }
                    ]
                },
                b1: {
                    text: "You've expanded the surveillance network. What's your focus?",
                    options: [
                        { text: "Monitor Results", nextStep: "s" },
                        { text: "Scale Back Surveillance", nextStep: "restart" }
                    ]
                },
                b2: {
                    text: "You've introduced Privacy Safeguards. What's your next step?",
                    options: [
                        { text: "Evaluate Community Response", nextStep: "s" },
                        { text: "Tighten Surveillance", nextStep: "s" }
                    ]
                },
                s: {
                    text: "You are at a strategic decision point. Choose your next action:",
                    options: [
                        { text: "Public Forums (S1)", nextStep: "s1" },
                        { text: "Media Campaign (S2)", nextStep: "s2" }
                    ]
                },
                s1: {
                    text: "You chose public forums. How will you engage the public?",
                    options: [
                        { text: "Engage in Dialogue (S1.A)", nextStep: "s1a" },
                        { text: "Focus on Action (S1.B)", nextStep: "s1b" }
                    ]
                },
                s1a: {
                    text: "Engage in Dialogue:",
                    options: [
                        { text: "Continue Forums (S1.A.A)", nextStep: "restart" },
                        { text: "Adjust Strategy (S1.A.B)", nextStep: "xa" }
                    ]
                },
                s1b: {
                    text: "Focus on Action:",
                    options: [
                        { text: "Legislate (S1.B.A)", nextStep: "xb" },
                        { text: "Maintain Current Policies (S1.B.B)", nextStep: "restart" }
                    ]
                },
                s2: {
                    text: "You chose a media campaign. How will you manage the media?",
                    options: [
                        { text: "Direct Dialogue (S2.A)", nextStep: "xc" },
                        { text: "Expand Campaign (S2.B)", nextStep: "restart" }
                    ]
                },
                xa: {
                    text: "Choose your strategy for adjusting public dialogue:",
                    options: [
                        { text: "Option XA1", nextStep: "restart" },
                        { text: "Option XA2", nextStep: "restart" }
                    ]
                },
                xb: {
                    text: "Choose how to legislate:",
                    options: [
                        { text: "Option XB1", nextStep: "restart" },
                        { text: "Option XB2", nextStep: "restart" }
                    ]
                },
                xc: {
                    text: "Choose your approach to dialogue:",
                    options: [
                        { text: "Option XC1", nextStep: "restart" },
                        { text: "Option XC2", nextStep: "restart" }
                    ]
                },
                restart: {
                    text: "You have reached a deadlock or end. Do you want to restart?",
                    options: [
                        { text: "Restart", nextStep: "start" }
                    ]
                }
            };

            displayStep('start');
        });
    </script>
</body>

</html>
