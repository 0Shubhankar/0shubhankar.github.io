        ];

        // Generate arcs data from Delhi to target locations
        const arcsData = locations.map(location => ({
            startLat: delhi.lat,
            startLng: delhi.lon,
            endLat: location.lat,
            endLng: location.lon,
            color: 'pink', // Set arc color as needed
            strokeWidth: location.arcCount / 10, // Set the arc thickness based on arcCount
            arcDashLength: 0.4,
            arcDashGap: 4,
            arcDashInitialGap: Math.random() * 5,
            arcDashAnimateTime: 1000
        }));

        const Globe = new ThreeGlobe()
            .globeImageUrl('earth-night.jpg')
            .arcsData(arcsData)
            .arcColor('color')
            .arcDashLength('arcDashLength')
            .arcDashGap('arcDashGap')
            .arcDashInitialGap('arcDashInitialGap')
            .arcDashAnimateTime('arcDashAnimateTime');

        // Setup renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('globeViz').appendChild(renderer.domElement);

        // Setup scene
        const scene = new THREE.Scene();
        scene.add(Globe);
        scene.add(new THREE.AmbientLight(0xcccccc, Math.PI));
        scene.add(new THREE.DirectionalLight(0xffffff, 0.6 * Math.PI));

        // Setup camera
        const camera = new THREE.PerspectiveCamera();
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        camera.position.z = 500;

        // Add camera controls
        const tbControls = new TrackballControls(camera, renderer.domElement);
        tbControls.minDistance = 101;
        tbControls.rotateSpeed = 5;
        tbControls.zoomSpeed = 0.8;

        // Kick-off renderer
        (function animate() { // IIFE
            // Frame cycle
            tbControls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        })();
