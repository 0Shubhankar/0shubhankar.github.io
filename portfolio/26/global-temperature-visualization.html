<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe with Countries</title>
    <style>
        body {
            margin: 0;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <script src="../vendor/shared/lib-25023b521d77/dist/three.min.js"></script>
    <script src="../vendor/shared/lib-1b307bf3cbda/dist/OrbitControls.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Set up scene, camera, and renderer
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Add orbit controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.25;
            controls.enableZoom = true;

            // Add lights
            const ambientLight = new THREE.AmbientLight(0xcccccc);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(1, 1, 1).normalize();
            scene.add(directionalLight);

            // Load textures
            const textureLoader = new THREE.TextureLoader();
            const globeTexture = textureLoader.load('//unpkg.com/three-globe/example/img/earth-dark.jpg');
            const temperatureTexture = textureLoader.load('temp.jpeg'); // Replace with the path to your temperature texture

            // Create the globe
            const globeGeometry = new THREE.SphereGeometry(50, 64, 64);
            const globeMaterial = new THREE.MeshBasicMaterial({ map: globeTexture });
            const globe = new THREE.Mesh(globeGeometry, globeMaterial);
            scene.add(globe);

            const temperatureMaterial = new THREE.MeshBasicMaterial({
                map: temperatureTexture,
                transparent: true,  // Enable transparency to see the base globe texture beneath
                opacity: 0.6        // Adjust opacity as needed to blend the textures
            });
            const temperatureOverlay = new THREE.Mesh(globeGeometry, temperatureMaterial);
            scene.add(temperatureOverlay);


            // Position the camera
            camera.position.z = 200;

            // Render loop
            const animate = function () {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            };
            animate();

            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>

</html>
