<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Simulation</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <script type="module">
        import { OrbitControls } from '../vendor/shared/lib-0809644caeac/dist/OrbitControls.js';
        import * as THREE from '../vendor/shared/lib-86c7ea3356c4/dist/three.module.js';
        import { GUI } from '../vendor/shared/lib-6ef06cdec5d6/dist/dat.gui.module.js';

        let scene, camera, controls, renderer, gui;
        let asphaltTexture, bldgTexture;
        const textureLoader = new THREE.TextureLoader();
        const cars = [];
        const guiData = {
            rows: 5,
            columns: 5,
            maxHeight: 2,
            carSpeed: 0.05,
            carCount: 5,
            fogColor: 0xffffff,
            fogNear: 1,
            fogFar: 8,
        };

        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 5);
            camera.lookAt(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setClearColor("#e5e5e5");
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enablePan = true;
            controls.panSpeed = 0.3;
            controls.update();

            gui = new GUI();
            gui.add(guiData, 'rows').min(1).max(40).step(1).onChange(rerender);
            gui.add(guiData, 'columns').min(1).max(40).step(1).onChange(rerender);
            gui.add(guiData, 'maxHeight').min(0.1).max(3).step(0.1);
            gui.add(guiData, 'carSpeed').min(0.01).max(0.1).step(0.01);
            gui.add(guiData, 'carCount').min(1).max(40).step(1).onChange(rerender);
            gui.addColor(guiData, 'fogColor').onChange(updateFog);
            gui.add(guiData, 'fogNear').min(0.1).max(100).step(0.1).onChange(updateFog);
            gui.add(guiData, 'fogFar').min(0.1).max(100).step(0.1).onChange(updateFog);

            window.addEventListener('resize', onWindowResize, false);

            await loadTextures();
            setup();
            animate();
        }

        let greenTexture;

            async function loadTextures() {
                asphaltTexture = await new Promise(resolve => textureLoader.load('road2.jpg', resolve));
                bldgTexture = await new Promise(resolve => textureLoader.load('building_texture.jpg', resolve));
                greenTexture = await new Promise(resolve => textureLoader.load('green.png', resolve)); // Load green texture
            }


        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setup() {
            addLights();
            addPlane();
            addCubes();
            // Car simulation not implemented in this version.
        }

        function rerender() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(guiData.fogColor);
            scene.fog = new THREE.Fog(guiData.fogColor, guiData.fogNear, guiData.fogFar);
            setup();
        }

        function updateFog() {
            scene.fog.color.set(guiData.fogColor);
            scene.fog.near = guiData.fogNear;
            scene.fog.far = guiData.fogFar;
            scene.background.set(guiData.fogColor);
        }

        function addLights() {
            let light = new THREE.PointLight(0xffffff, 0.6);
            light.position.set(40, 30, 20);
            scene.add(light);
            let scndLight = new THREE.PointLight(0xffffff, 0.4);
            scndLight.position.set(-20, 10, -30);
            scene.add(scndLight);
        }

        function addPlane() {
            let geometry = new THREE.PlaneGeometry(guiData.columns + 1, guiData.rows + 1);
            let material = new THREE.MeshBasicMaterial({ map: asphaltTexture, side: THREE.DoubleSide });
            let plane = new THREE.Mesh(geometry, material);
            plane.rotation.x = Math.PI / 2;
            scene.add(plane);
        }

        function addCubes() {
                for (let i = 0; i < guiData.columns; i++) {
                    for (let j = 0; j < guiData.rows; j++) {
                        // Determine if this position will have a building or a green space
                        const isGreenSpace = Math.random() < 0.5; // 20% chance of green space

                        if (isGreenSpace) {
                            // Create a green space instead of a building
                            const geometry = new THREE.PlaneGeometry(1, 1);
                            const material = new THREE.MeshBasicMaterial({
                                map: greenTexture, // Use the green texture
                                side: THREE.DoubleSide
                            });
                            const greenSpace = new THREE.Mesh(geometry, material);
                            greenSpace.rotation.x = -Math.PI / 2; // Rotate to lay flat
                            greenSpace.position.set(i - (guiData.columns / 2 - 0.5), 0.01, j - (guiData.rows / 2 - 0.5)); // Slightly above ground to avoid z-fighting
                            scene.add(greenSpace);
                        } else {
                            // Create a building
                            const boxHeight = Math.random() * guiData.maxHeight + 0.1;
                            const geometry = new THREE.BoxGeometry(0.7, boxHeight, 0.7);
                            const material = new THREE.MeshLambertMaterial({
                                map: bldgTexture,
                                transparent: true,
                                opacity: 0.8
                            });
                            const cube = new THREE.Mesh(geometry, material);
                            cube.position.set(i - (guiData.columns / 2 - 0.5), boxHeight / 2, j - (guiData.rows / 2 - 0.5));
                            cube.name = 'cube';
                            scene.add(cube);
                        }
                    }
                }
            }



  
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>

</html>
