    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Coffee Shop Density Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/shared/lib-34b3c0e131eb/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="../vendor/shared/lib-5d00f470f487/dist/leaflet.js"></script>
    <script src="../shared/map-tiles.js"></script>
    <script src="../vendor/shared/lib-5cb2beba5c37/dist/leaflet-heat.js"></script>
    <script src="../vendor/shared/lib-51d788816744/dist/papaparse.min.js"></script>
    <script>
        // Initialize the map
        var map = L.map('map').setView([37.0902, -95.7129], 5);

        // Add a tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a> | Data source: <a href="https://www.openstreetmap.org" target="_blank">OpenStreetMap</a>'
        }).addTo(map);

        // Parse CSV data
        Papa.parse('cleaned_usa_coffee_shops.csv', {
            download: true,
            header: true,
            complete: function(results) {
                var data = results.data;
                var heatData = data.map(function(shop) {
                    return [parseFloat(shop.latitude), parseFloat(shop.longitude)];
                });

                // Add heat map layer
                L.heatLayer(heatData, {
                    radius: 50, // Adjust radius for visualization
                    blur: 20,   // Adjust blur for visualization
                    maxZoom: 17,
                    gradient: { 0.3: 'brown', 0.5: 'orange', 0.7: 'yellow', 1: 'white' } // Coffee-themed gradient
                }).addTo(map);
            }
        });
    </script>
</body>
