<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Leaflet Map with Custom Animated Icons</title>
    <link rel="stylesheet" href="../vendor/shared/lib-301c4190d5f2/dist/leaflet.css" />
    <script src="../vendor/shared/lib-51d788816744/dist/papaparse.min.js"></script>

    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
            background: black;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .blinking-circle {
        animation: blink 1s infinite;
        }

        @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0; }
        100% { opacity: 1; }
        }
    </style>

<style id="sentiment-dark-map-fix">
/* Dark navy geographic tiles; sentiment markers remain unchanged. */
html, body, #map {
    background: #091827 !important;
}

.leaflet-tile-pane img.leaflet-tile {
    filter: grayscale(1) invert(1) sepia(1)
            hue-rotate(170deg) saturate(1.8)
            brightness(0.48) contrast(1.25);
}
</style>

</head>

<body>
    <div id="map"></div>
    <script src="../vendor/shared/lib-d39c45fd86ca/dist/leaflet.js"></script>
    <script type="module">
        // Initialize the Leaflet map
        var map = L.map('map').setView([38.8928901311895, -77.020314939909], 13);

        // Add CartoDB Dark Matter tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Data source: <a href="https://opendata.dc.gov/datasets/3f28bc3ad77f49079efee0ac05d8464c_0/explore" target="_blank">Open Data DC</a>'
            }).addTo(map);


        // Function to create a single hollow circle with blinking effect based on sentiment score
        function createBlinkingCircle(lat, lon, popupContent, sentimentScore) {
            const circleOptions = {
                color: 'green',
                fillColor: 'transparent',
                fillOpacity: 0,
                weight: 3
            };

            const radius = 12; // Adjust radius as needed
            const circle = L.circle([lat, lon], { ...circleOptions, radius }).addTo(map);
            circle.bindPopup(popupContent);

            // Create blinking effect based on sentiment score
            let opacity = 0;
            let direction = 1;
            const maxOpacity = Math.min(1, Math.abs(sentimentScore));
            setInterval(() => {
                opacity += direction * 0.05;
                if (opacity >= maxOpacity || opacity <= 0) {
                    direction *= -1;
                }
                circle.setStyle({ opacity: opacity });
            }, 100);
        }

        // Function to load CSV data and create circles with popups
        function loadCSVData(url) {
            Papa.parse(url, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function (results) {
                    results.data.forEach(row => {
                        const lat = parseFloat(row.Y);
                        const lon = parseFloat(row.X);
                        const popupContent = `
                            <strong>OBJECTID:</strong> ${row.OBJECTID}<br>
                            <strong>GLOBALID:</strong> ${row.GLOBALID}<br>
                            <strong>REQUESTID:</strong> ${row.REQUESTID}<br>
                            <strong>USERTYPE:</strong> ${row.USERTYPE}<br>
                            <strong>REQUESTTYPE:</strong> ${row.REQUESTTYPE}<br>
                            <strong>REQUESTDATE:</strong> ${row.REQUESTDATE}<br>
                            <strong>STATUS:</strong> ${row.STATUS}<br>
                            <strong>STREETSEGID:</strong> ${row.STREETSEGID}<br>
                            <strong>COMMENTS:</strong> ${row.COMMENTS}<br>
                            <strong>sentiment_score:</strong> ${row.sentiment_score}<br>
                            <strong>cluster:</strong> ${row.cluster}
                        `;
                        const sentimentScore = parseFloat(row.sentiment_score);
                        if (!isNaN(lat) && !isNaN(lon)) {
                            // Create blinking circle with popup
                            createBlinkingCircle(lat, lon, popupContent, sentimentScore);
                        } else {
                            console.warn(`Invalid data at row:`, row); // Debugging statement
                        }
                    });
                }
            });
        }

        // Load CSV data
        loadCSVData('cleaned_csv_file.csv'); // Replace with the path to your CSV file
    </script>
</body>

</html>
