<!DOCTYPE html>
<html>

<head>
    <title>Delhi Dead-End Roads Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../vendor/shared/lib-9eaeb463f1b3/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        #map {
            height: 100vh;
            width: 100vw;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="../vendor/shared/lib-1c09437b70d7/dist/maplibre-gl.js"></script>
    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: [77.2091, 28.6148],
            zoom: 14,
            pitch: 60,
            bearing: 17.6,
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        map.on('load', function () {
            map.addSource('delhiDeadEnds', {
                type: 'geojson',
                data: './delhi_dead_end_edges.geojson' // Ensure this path is correct
            });

            map.addLayer({
                id: 'dead-ends',
                type: 'line',
                source: 'delhiDeadEnds',
                layout: {},
                paint: {
                    'line-color': '#ff0000',
                    'line-width': 4
                }
            });

            let colorState = false;  // toggle state

            setInterval(() => {
                const newColor = colorState ? '#ff0000' : '#ffffff';
                map.setPaintProperty('dead-ends', 'line-color', newColor);
                colorState = !colorState;  // toggle the state
            }, 1000);  // Change color every second
        });
    </script>
</body>

</html>
